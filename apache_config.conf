# Apache Configuration for Educational Platform
# This configuration enables Apache signal handling for the Django application

<VirtualHost *:80>
    ServerName educational-platform.local
    ServerAdmin admin@educational-platform.local

    # Django project directory
    DocumentRoot /home/runner/work/Globa-educational-platform/Globa-educational-platform

    # WSGI Configuration with Apache signals enabled
    WSGIDaemonProcess educational_platform python-path=/home/runner/work/Globa-educational-platform/Globa-educational-platform
    WSGIProcessGroup educational_platform
    WSGIScriptAlias / /home/runner/work/Globa-educational-platform/Globa-educational-platform/educational_platform/wsgi.py

    # Enable Apache signal handling
    # Graceful restart: apachectl graceful (sends SIGUSR1)
    # Stop: apachectl stop (sends SIGTERM)
    # Restart: apachectl restart (sends SIGHUP)
    
    <Directory /home/runner/work/Globa-educational-platform/Globa-educational-platform/educational_platform>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    # Static files
    Alias /static /home/runner/work/Globa-educational-platform/Globa-educational-platform/static
    <Directory /home/runner/work/Globa-educational-platform/Globa-educational-platform/static>
        Require all granted
    </Directory>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/educational_platform_error.log
    CustomLog ${APACHE_LOG_DIR}/educational_platform_access.log combined
</VirtualHost>
